{% extends "base.html" %}{% from "macros.html" import fig, lines with context %}{% block content %}
<div class="person">
  {% if s.image %}{{ fig(s.image, 'portrait') }}{% endif %}
  <div class="text">
    {% if s.kicker %}<p class="kicker">{{ s.kicker }}</p>{% endif %}
    <h2 class="title">{{ lines(s.title) }}</h2>
    <p class="body">{{ lines(s.body) }}</p>
  </div>
</div>
{% endblock %}
